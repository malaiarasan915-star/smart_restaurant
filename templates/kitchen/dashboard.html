{% extends 'base.html' %}
{% load static %}

{% block title %}Kitchen Board - Smart Dine{% endblock %}

{% block content %}
<div class="row justify-content-center py-4">
  <div class="col-12">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <h2 class="font-playfair fw-bold mb-0 text-dark"><i class="bi bi-fire text-warning me-1"></i> Kitchen Board</h2>
        <p class="text-muted mb-0">Live cooking queue of confirmed orders</p>
      </div>
      <div class="d-flex align-items-center gap-3">
        <span class="badge bg-dark px-3 py-2 rounded-pill"><i class="bi bi-clock"></i> Auto-refreshing</span>
      </div>
    </div>

    <!-- React KitchenBoard mount point -->
    <div id="kitchen-board-root">
      <div class="card card-premium p-4 border-0 text-center shadow-sm">
        <div class="spinner-border text-warning mx-auto my-3" role="status"></div>
        <p class="text-muted">Loading cooking queue...</p>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<!-- Mount Kitchen Board React component -->
<script type="text/babel" src="{% static 'js/KitchenBoard.js' %}"></script>
{% endblock %}
