services:
  - type: web
    name: smart-restaurant-5ml5          # Must match your exact Render service name
    env: python
    plan: free
    region: singapore                    # Closest to India
    buildCommand: "chmod +x build.sh && ./build.sh"
    startCommand: "daphne -b 0.0.0.0 -p $PORT restaurant_project.asgi:application"
    healthCheckPath: /health/            # Safe public endpoint (no login required)
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "smart-restaurant-5ml5.onrender.com"
      - key: BASE_URL
        value: "https://smart-restaurant-5ml5.onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: smart-restaurant-db      # Links to the PostgreSQL service below
          property: connectionString
      - key: RENDER_EXTERNAL_HOSTNAME
        value: "smart-restaurant-5ml5.onrender.com"
      - key: RAZORPAY_KEY_ID
        sync: false                      # Set manually in Render dashboard
      - key: RAZORPAY_KEY_SECRET
        sync: false                      # Set manually in Render dashboard

databases:
  - name: smart-restaurant-db           # Render will CREATE this PostgreSQL instance
    plan: free
    region: singapore
    databaseName: smart_restaurant
    user: smart_restaurant_user
