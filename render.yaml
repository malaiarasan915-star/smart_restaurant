services:
  - type: web
    name: smart-restaurant
    env: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "daphne -b 0.0.0.0 -p $PORT restaurant_project.asgi:application"
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "smart-restaurant.onrender.com"
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: smart-restaurant-db
          property: connectionString
      - key: BASE_URL
        value: "https://smart-restaurant.onrender.com"

databases:
  - name: smart-restaurant-db
    plan: free
