services:
  - type: web
    name: smart-restaurant              # Use the EXACT name shown in Render dashboard
    env: python
    plan: free
    region: singapore
    buildCommand: "chmod +x build.sh && ./build.sh"
    startCommand: "daphne -b 0.0.0.0 -p $PORT restaurant_project.asgi:application"
    healthCheckPath: /health/
    # NOTE: migrate runs inside build.sh with verbose output + table verification
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "smart-restaurant-5ml5.onrender.com"
      - key: BASE_URL
        value: "https://smart-restaurant-5ml5.onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: smart-restaurant-db
          property: connectionString
      - key: RENDER_EXTERNAL_HOSTNAME
        value: "smart-restaurant-5ml5.onrender.com"
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false

databases:
  - name: smart-restaurant-db
    plan: free
    region: singapore
    databaseName: smart_restaurant
    user: smart_restaurant_user
