services:
  - type: web
    name: smart-restaurant              # Use the EXACT name shown in Render dashboard
    env: python
    plan: free
    region: singapore
    buildCommand: "chmod +x build.sh start.sh && ./build.sh"
    startCommand: "./start.sh"
    healthCheckPath: /health/
    # NOTE: migrate runs in start.sh on EVERY boot (idempotent, guarantees schema)
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: DJANGO_SETTINGS_MODULE
        value: "restaurant_project.settings"
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "smart-restaurant-5ml5.onrender.com"
      - key: BASE_URL
        value: "https://smart-restaurant-5ml5.onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: smart-restaurant-db
          property: connectionString
      - key: RENDER_EXTERNAL_HOSTNAME
        value: "smart-restaurant-5ml5.onrender.com"
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false

databases:
  - name: smart-restaurant-db
    plan: free
    region: singapore
    databaseName: smart_restaurant
    user: smart_restaurant_user
